name: Publish to Comfy registry

# comfy-cli publishes the version written in pyproject.toml, so a push that
# changes that file is a release. Run the job by hand from the Actions tab too.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        # Needs the registry API key of publisher ffffair in the repository
        # secrets, under the name REGISTRY_ACCESS_TOKEN.
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
