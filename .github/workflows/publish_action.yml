name: Publish to Comfy registry

# comfy-cli publishes the version written in pyproject.toml, so a push that changes
# that file is a release. The Actions tab can run this job by hand as well.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # Pinned, so the release path does not move underneath this workflow.
      - name: Install comfy-cli
        run: pip install comfy-cli==1.28.0

      # Through the environment rather than Comfy-Org/publish-node-action, which
      # interpolates the key into a shell line unquoted: a key saved with a stray
      # space or newline then reaches comfy-cli as extra arguments.
      - name: Publish to the registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
