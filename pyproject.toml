[project]
name = "depth-pro-2" # the registry id, already reserved for this repository
version = "1.4.1"
description = "Apple Depth Pro 2 monocular depth for ComfyUI: sharp full-resolution depth from one photo, temporally consistent depth for video, separate PyTorch and Core ML focal loaders with pixel and millimetre outputs, and Apple's published Core ML packages on Apple silicon."
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Keep in step with requirements.txt, which ComfyUI-Manager installs from.
dependencies = [
    "timm>=1.0.27,<1.1",
    "huggingface-hub>=1.0",
    "safetensors",
    "certifi",
    "pyobjc-framework-CoreML>=13; sys_platform == 'darwin'",
]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Apple Metal",
]

[project.urls]
Repository = "https://github.com/yanhuifair/comfyui-depth-pro-2"
Documentation = "https://github.com/yanhuifair/comfyui-depth-pro-2#readme"
"Bug Tracker" = "https://github.com/yanhuifair/comfyui-depth-pro-2/issues"

[tool.comfy]
PublisherId = "fffffair"
DisplayName = "Depth Pro 2"
requires-comfyui = ">=0.3.48" # the first release with the V3 node API this plugin uses
